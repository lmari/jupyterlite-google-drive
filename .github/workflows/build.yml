name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested demo to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt build
          npm install
      - name: Check JavaScript and run unit tests
        run: |
          npm run check
          npm test
      - name: Build unconfigured demo
        run: python scripts/build_demo.py
      - name: Install Chromium and Firefox
        run: python -m playwright install --with-deps chromium firefox
      - name: Test menu activation in browser
        run: python scripts/smoke_browser.py
      - name: Test touch editing tools and real Python completion
        run: python scripts/smoke_editing.py
      - name: Test Variables dialog on portrait touch viewports
        run: python scripts/smoke_variables_touch.py
      - name: Test two-browser Drive round trip (mocked Google)
        run: python scripts/smoke_drive.py
      - name: Test mounted Python data through isolated DriveFS
        run: python scripts/smoke_mount.py
      - name: Test mounted Python data through Pages-like service worker
        run: python scripts/smoke_mount.py --transport service-worker
      - name: Package prebuilt Python wheel
        run: python scripts/package_wheel.py
      - name: Verify installed wheel in separate JupyterLite build
        run: python scripts/smoke_wheel.py
      - name: Verify installed extension in browser
        run: python scripts/smoke_browser.py --site wheel-demo
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-google-drive-wheel
          path: wheel-dist/*.whl
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            smoke-failure.png
            editing-failure.png
            variables-touch-*.png
            drive-failure-*.png
            mount-failure*.png
          if-no-files-found: ignore
      - name: Inject public OAuth configuration and rebuild for deployment
        if: github.ref == 'refs/heads/main' && (vars.PAGES_ENABLED == 'true' || inputs.deploy == true)
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ vars.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_APP_ID: ${{ vars.GOOGLE_DRIVE_APP_ID }}
        run: python scripts/build_demo.py
      - name: Upload static demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-demo
          path: dist/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (vars.PAGES_ENABLED == 'true' || inputs.deploy == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (vars.PAGES_ENABLED == 'true' || inputs.deploy == true)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
